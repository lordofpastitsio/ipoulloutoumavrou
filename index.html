<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>Cyprus Heritage AR</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
            background: #f5f5f5;
            color: #1a1a1a;
        }

        /* Header */
        .header {
            background: white;
            padding: 16px 20px;
            border-bottom: 1px solid #e5e5e5;
            position: sticky;
            top: 0;
            z-index: 10;
        }

        .header h1 {
            font-size: 24px;
            font-weight: 700;
            color: #1a1a1a;
        }

        .header p {
            font-size: 14px;
            color: #666;
            margin-top: 4px;
        }

        /* Main Container */
        .container {
            max-width: 1200px;
            margin: 0 auto;
            padding: 20px;
        }

        /* Add Building Button */
        .add-btn {
            background: #1a73e8;
            color: white;
            border: none;
            padding: 14px 24px;
            border-radius: 12px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            display: flex;
            align-items: center;
            gap: 8px;
            margin-bottom: 24px;
            width: 100%;
            justify-content: center;
        }

        .add-btn:hover {
            background: #1557b0;
        }

        /* Buildings Grid */
        .buildings-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(350px, 1fr));
            gap: 20px;
        }

        /* Building Card */
        .building-card {
            background: white;
            border-radius: 16px;
            overflow: hidden;
            box-shadow: 0 2px 8px rgba(0,0,0,0.08);
            transition: transform 0.2s, box-shadow 0.2s;
        }

        .building-card:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 24px rgba(0,0,0,0.12);
        }

        /* Image Section */
        .card-image {
            position: relative;
            height: 220px;
            background: #f0f0f0;
            overflow: hidden;
        }

        .card-image img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        .model-badge {
            position: absolute;
            top: 12px;
            right: 12px;
            background: rgba(0,0,0,0.7);
            backdrop-filter: blur(8px);
            padding: 6px 12px;
            border-radius: 20px;
            font-size: 12px;
            color: white;
            display: flex;
            align-items: center;
            gap: 6px;
        }

        /* Content Section */
        .card-content {
            padding: 16px;
        }

        .card-title {
            font-size: 18px;
            font-weight: 700;
            margin-bottom: 8px;
            color: #1a1a1a;
        }

        .card-period {
            font-size: 13px;
            color: #1a73e8;
            font-weight: 500;
            margin-bottom: 8px;
        }

        .card-description {
            font-size: 14px;
            color: #666;
            line-height: 1.5;
            margin-bottom: 16px;
            display: -webkit-box;
            -webkit-line-clamp: 3;
            -webkit-box-orient: vertical;
            overflow: hidden;
        }

        /* Card Actions */
        .card-actions {
            display: flex;
            gap: 12px;
            padding-top: 12px;
            border-top: 1px solid #eee;
        }

        .view-model-btn {
            flex: 1;
            background: #1a73e8;
            color: white;
            border: none;
            padding: 10px;
            border-radius: 10px;
            font-size: 14px;
            font-weight: 500;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 6px;
        }

        .edit-btn, .delete-btn {
            background: #f0f0f0;
            border: none;
            padding: 10px 14px;
            border-radius: 10px;
            cursor: pointer;
            font-size: 14px;
            transition: background 0.2s;
        }

        .edit-btn:hover {
            background: #e0e0e0;
        }

        .delete-btn:hover {
            background: #fee2e2;
            color: #dc2626;
        }

        /* Modal */
        .modal {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: rgba(0,0,0,0.5);
            z-index: 100;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }

        .modal-content {
            background: white;
            border-radius: 24px;
            max-width: 600px;
            width: 100%;
            max-height: 90vh;
            overflow-y: auto;
        }

        .modal-header {
            padding: 20px;
            border-bottom: 1px solid #eee;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .modal-header h2 {
            font-size: 20px;
        }

        .close-modal {
            background: none;
            border: none;
            font-size: 28px;
            cursor: pointer;
            color: #999;
        }

        .modal-body {
            padding: 20px;
        }

        .form-group {
            margin-bottom: 20px;
        }

        .form-group label {
            display: block;
            font-size: 14px;
            font-weight: 600;
            margin-bottom: 8px;
            color: #333;
        }

        .form-group input, 
        .form-group textarea {
            width: 100%;
            padding: 12px;
            border: 1px solid #ddd;
            border-radius: 12px;
            font-size: 14px;
            font-family: inherit;
        }

        .form-group textarea {
            resize: vertical;
            min-height: 100px;
        }

        .form-group .hint {
            font-size: 12px;
            color: #999;
            margin-top: 4px;
        }

        .save-btn {
            background: #1a73e8;
            color: white;
            border: none;
            padding: 14px;
            border-radius: 12px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            width: 100%;
        }

        /* 3D Viewer Modal */
        .viewer-modal {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: black;
            z-index: 200;
        }

        .viewer-header {
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            padding: 16px;
            background: linear-gradient(to bottom, rgba(0,0,0,0.5), transparent);
            z-index: 10;
        }

        .viewer-close {
            background: rgba(255,255,255,0.2);
            border: none;
            color: white;
            font-size: 24px;
            padding: 8px 16px;
            border-radius: 30px;
            cursor: pointer;
        }

        .viewer-info {
            position: absolute;
            bottom: 0;
            left: 0;
            right: 0;
            background: linear-gradient(to top, rgba(0,0,0,0.8), transparent);
            padding: 24px;
            color: white;
            z-index: 10;
        }

        .viewer-info h3 {
            font-size: 24px;
            margin-bottom: 8px;
        }

        .viewer-info p {
            font-size: 14px;
            opacity: 0.8;
        }

        #model-viewer {
            width: 100%;
            height: 100%;
        }

        /* Empty State */
        .empty-state {
            text-align: center;
            padding: 60px 20px;
            color: #999;
        }

        .empty-state span {
            font-size: 64px;
            display: block;
            margin-bottom: 16px;
        }

        @media (max-width: 768px) {
            .container {
                padding: 16px;
            }
            .buildings-grid {
                grid-template-columns: 1fr;
            }
        }
    </style>
</head>
<body>
    <div class="header">
        <h1>🏛️ Cyprus Heritage AR</h1>
        <p>Manage historical buildings with 3D models and descriptions</p>
    </div>

    <div class="container">
        <button class="add-btn" onclick="openAddModal()">+ Add New Building</button>
        
        <div id="buildings-grid" class="buildings-grid">
            <!-- Buildings will appear here -->
        </div>
    </div>

    <!-- Add/Edit Modal -->
    <div id="building-modal" class="modal">
        <div class="modal-content">
            <div class="modal-header">
                <h2 id="modal-title">Add Building</h2>
                <button class="close-modal" onclick="closeModal()">×</button>
            </div>
            <div class="modal-body">
                <form id="building-form">
                    <input type="hidden" id="building-id">
                    
                    <div class="form-group">
                        <label>Building Name *</label>
                        <input type="text" id="building-name" required placeholder="e.g., Limassol Castle">
                    </div>
                    
                    <div class="form-group">
                        <label>Historical Period</label>
                        <input type="text" id="building-period" placeholder="e.g., 13th Century | Medieval">
                    </div>
                    
                    <div class="form-group">
                        <label>Photo URL</label>
                        <input type="url" id="building-image" placeholder="https://example.com/photo.jpg">
                        <div class="hint">Paste a direct image URL (JPG, PNG)</div>
                    </div>
                    
                    <div class="form-group">
                        <label>3D Model URL (GLB/GLTF)</label>
                        <input type="url" id="building-model" placeholder="https://example.com/model.glb">
                        <div class="hint">Upload .glb file and paste the URL</div>
                    </div>
                    
                    <div class="form-group">
                        <label>Description</label>
                        <textarea id="building-description" placeholder="Write a detailed historical description..."></textarea>
                    </div>
                    
                    <button type="submit" class="save-btn">Save Building</button>
                </form>
            </div>
        </div>
    </div>

    <!-- 3D Viewer Modal -->
    <div id="viewer-modal" class="viewer-modal">
        <div class="viewer-header">
            <button class="viewer-close" onclick="closeViewer()">← Back</button>
        </div>
        <div id="model-viewer"></div>
        <div class="viewer-info">
            <h3 id="viewer-title"></h3>
            <p id="viewer-description"></p>
        </div>
    </div>

    <script type="importmap">
        {
            "imports": {
                "three": "https://unpkg.com/three@0.128.0/build/three.module.js",
                "three/addons/": "https://unpkg.com/three@0.128.0/examples/jsm/"
            }
        }
    </script>

    <script type="module">
        import * as THREE from 'three';
        import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
        import { GLTFLoader } from 'three/addons/loaders/GLTFLoader.js';

        // ============================================
        // DATA MANAGEMENT
        // ============================================
        
        let buildings = [];
        let currentViewer = null;
        let currentScene = null;

        // Load from localStorage
        function loadBuildings() {
            const saved = localStorage.getItem('cyprus-buildings');
            if (saved) {
                buildings = JSON.parse(saved);
            } else {
                // Default sample buildings
                buildings = [
                    {
                        id: Date.now(),
                        name: "Limassol Castle",
                        period: "13th Century | Medieval",
                        imageUrl: "https://upload.wikimedia.org/wikipedia/commons/thumb/9/9e/Limassol_Castle_01.jpg/800px-Limassol_Castle_01.jpg",
                        modelUrl: "",
                        description: "Built by the Lusignans in the 13th century. Famous as the location where Richard the Lionheart married Berengaria of Navarre in 1191. Now houses the Cyprus Medieval Museum."
                    },
                    {
                        id: Date.now() + 1,
                        name: "Kolossi Castle",
                        period: "1210 AD | Crusader",
                        imageUrl: "https://upload.wikimedia.org/wikipedia/commons/thumb/6/6a/Kolossi_Castle_01.jpg/800px-Kolossi_Castle_01.jpg",
                        modelUrl: "",
                        description: "Former Crusader stronghold built by the Knights of St. John. Famous for producing Commandaria, one of the world's oldest wines."
                    }
                ];
                saveBuildings();
            }
            renderBuildings();
        }

        function saveBuildings() {
            localStorage.setItem('cyprus-buildings', JSON.stringify(buildings));
        }

        function addBuilding(building) {
            building.id = Date.now();
            buildings.push(building);
            saveBuildings();
            renderBuildings();
        }

        function updateBuilding(id, updated) {
            const index = buildings.findIndex(b => b.id == id);
            if (index !== -1) {
                buildings[index] = { ...buildings[index], ...updated, id: parseInt(id) };
                saveBuildings();
                renderBuildings();
            }
        }

        function deleteBuilding(id) {
            buildings = buildings.filter(b => b.id != id);
            saveBuildings();
            renderBuildings();
        }

        // ============================================
        // RENDER BUILDINGS GRID
        // ============================================
        
        function renderBuildings() {
            const grid = document.getElementById('buildings-grid');
            
            if (buildings.length === 0) {
                grid.innerHTML = `
                    <div class="empty-state">
                        <span>🏛️</span>
                        <h3>No buildings yet</h3>
                        <p>Click "Add New Building" to get started</p>
                    </div>
                `;
                return;
            }
            
            grid.innerHTML = buildings.map(building => `
                <div class="building-card" data-id="${building.id}">
                    <div class="card-image">
                        <img src="${building.imageUrl || 'https://placehold.co/800x600/eee/999?text=No+Image'}" 
                             alt="${building.name}"
                             onerror="this.src='https://placehold.co/800x600/eee/999?text=Image+Not+Found'">
                        ${building.modelUrl ? '<div class="model-badge">🎮 3D Model Available</div>' : ''}
                    </div>
                    <div class="card-content">
                        <h3 class="card-title">${building.name}</h3>
                        <div class="card-period">${building.period || 'Historical Site'}</div>
                        <p class="card-description">${building.description || 'No description provided.'}</p>
                        <div class="card-actions">
                            ${building.modelUrl ? `<button class="view-model-btn" onclick="view3DModel(${building.id})">🎮 View 3D Model</button>` : ''}
                            <button class="edit-btn" onclick="openEditModal(${building.id})">✏️ Edit</button>
                            <button class="delete-btn" onclick="deleteBuilding(${building.id})">🗑️ Delete</button>
                        </div>
                    </div>
                </div>
            `).join('');
        }

        // ============================================
        // MODAL HANDLERS
        // ============================================
        
        window.openAddModal = () => {
            document.getElementById('modal-title').textContent = 'Add Building';
            document.getElementById('building-form').reset();
            document.getElementById('building-id').value = '';
            document.getElementById('building-modal').style.display = 'flex';
        };

        window.openEditModal = (id) => {
            const building = buildings.find(b => b.id == id);
            if (building) {
                document.getElementById('modal-title').textContent = 'Edit Building';
                document.getElementById('building-id').value = building.id;
                document.getElementById('building-name').value = building.name;
                document.getElementById('building-period').value = building.period || '';
                document.getElementById('building-image').value = building.imageUrl || '';
                document.getElementById('building-model').value = building.modelUrl || '';
                document.getElementById('building-description').value = building.description || '';
                document.getElementById('building-modal').style.display = 'flex';
            }
        };

        window.closeModal = () => {
            document.getElementById('building-modal').style.display = 'none';
        };

        window.deleteBuilding = (id) => {
            if (confirm('Are you sure you want to delete this building?')) {
                deleteBuilding(id);
            }
        };

        // Form submission
        document.getElementById('building-form').onsubmit = (e) => {
            e.preventDefault();
            
            const id = document.getElementById('building-id').value;
            const buildingData = {
                name: document.getElementById('building-name').value,
                period: document.getElementById('building-period').value,
                imageUrl: document.getElementById('building-image').value,
                modelUrl: document.getElementById('building-model').value,
                description: document.getElementById('building-description').value
            };
            
            if (id) {
                updateBuilding(id, buildingData);
            } else {
                addBuilding(buildingData);
            }
            
            closeModal();
        };

        // ============================================
        // 3D MODEL VIEWER
        // ============================================
        
        window.view3DModel = (id) => {
            const building = buildings.find(b => b.id == id);
            if (!building || !building.modelUrl) return;
            
            document.getElementById('viewer-title').textContent = building.name;
            document.getElementById('viewer-description').textContent = building.description || building.period || '';
            document.getElementById('viewer-modal').style.display = 'flex';
            
            init3DViewer(building.modelUrl);
        };

        window.closeViewer = () => {
            document.getElementById('viewer-modal').style.display = 'none';
            if (currentScene) {
                currentScene.dispose();
                currentScene = null;
            }
        };

        function init3DViewer(modelUrl) {
            const container = document.getElementById('model-viewer');
            
            // Clear previous
            while (container.firstChild) {
                container.removeChild(container.firstChild);
            }
            
            // Setup scene
            const scene = new THREE.Scene();
            scene.background = new THREE.Color(0x111111);
            
            // Setup camera
            const camera = new THREE.PerspectiveCamera(45, container.clientWidth / container.clientHeight, 0.1, 1000);
            camera.position.set(2, 2, 5);
            camera.lookAt(0, 0, 0);
            
            // Setup renderer
            const renderer = new THREE.WebGLRenderer({ antialias: true });
            renderer.setSize(container.clientWidth, container.clientHeight);
            renderer.setPixelRatio(window.devicePixelRatio);
            container.appendChild(renderer.domElement);
            
            // Controls
            const controls = new OrbitControls(camera, renderer.domElement);
            controls.enableDamping = true;
            controls.autoRotate = true;
            controls.autoRotateSpeed = 2;
            controls.enableZoom = true;
            
            // Lighting
            const ambientLight = new THREE.AmbientLight(0x404040);
            scene.add(ambientLight);
            
            const directionalLight = new THREE.DirectionalLight(0xffffff, 1);
            directionalLight.position.set(1, 2, 1);
            scene.add(directionalLight);
            
            const backLight = new THREE.DirectionalLight(0xffffff, 0.5);
            backLight.position.set(-1, 1, -2);
            scene.add(backLight);
            
            // Helper grid
            const gridHelper = new THREE.GridHelper(10, 20, 0x888888, 0x444444);
            scene.add(gridHelper);
            
            // Load model
            const loader = new GLTFLoader();
            loader.load(modelUrl, 
                (gltf) => {
                    const model = gltf.scene;
                    model.scale.set(1, 1, 1);
                    scene.add(model);
                },
                (progress) => {
                    console.log('Loading progress:', progress);
                },
                (error) => {
                    console.error('Error loading model:', error);
                    // Show fallback
                    const geometry = new THREE.BoxGeometry(1, 1, 1);
                    const material = new THREE.MeshStandardMaterial({ color: 0x1a73e8 });
                    const cube = new THREE.Mesh(geometry, material);
                    scene.add(cube);
                }
            );
            
            // Animation loop
            function animate() {
                requestAnimationFrame(animate);
                controls.update(); // Update for auto-rotate
                renderer.render(scene, camera);
            }
            animate();
            
            // Handle resize
            const resizeObserver = new ResizeObserver(() => {
                camera.aspect = container.clientWidth / container.clientHeight;
                camera.updateProjectionMatrix();
                renderer.setSize(container.clientWidth, container.clientHeight);
            });
            resizeObserver.observe(container);
            
            currentScene = { dispose: () => {
                resizeObserver.disconnect();
                renderer.dispose();
            }};
        }

        // ============================================
        // INIT
        // ============================================
        
        loadBuildings();
        
        // Close modal on background click
        window.onclick = (e) => {
            const modal = document.getElementById('building-modal');
            const viewer = document.getElementById('viewer-modal');
            if (e.target === modal) closeModal();
            if (e.target === viewer) closeViewer();
        };
    </script>
</body>
</html>
