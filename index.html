<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>Cyprus AR Heritage</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif;
            background: #000;
            overflow: hidden;
        }

        /* Camera view */
        #camera-view {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            object-fit: cover;
            z-index: 1;
        }

        /* AR Canvas */
        #ar-canvas {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 2;
        }

        /* UI Overlay */
        .ui-overlay {
            position: fixed;
            bottom: 0;
            left: 0;
            right: 0;
            z-index: 10;
            padding: 20px;
            background: linear-gradient(to top, rgba(0,0,0,0.9), transparent);
            pointer-events: none;
        }

        .info-card {
            background: rgba(0,0,0,0.85);
            backdrop-filter: blur(20px);
            border-radius: 24px;
            padding: 20px;
            margin-bottom: 16px;
            border: 1px solid rgba(255,215,0,0.3);
            transform: translateY(0);
            transition: all 0.3s ease;
            pointer-events: auto;
        }

        .info-card h1 {
            color: #FFD700;
            font-size: 20px;
            font-weight: 600;
            margin-bottom: 8px;
        }

        .info-card p {
            color: rgba(255,255,255,0.9);
            font-size: 14px;
            line-height: 1.5;
        }

        .info-card .badge {
            display: inline-block;
            background: rgba(255,215,0,0.2);
            color: #FFD700;
            padding: 4px 12px;
            border-radius: 20px;
            font-size: 12px;
            margin-top: 10px;
        }

        /* Buttons */
        .action-buttons {
            display: flex;
            gap: 12px;
            justify-content: flex-end;
            pointer-events: auto;
        }

        .btn {
            width: 52px;
            height: 52px;
            border-radius: 26px;
            background: rgba(0,0,0,0.85);
            backdrop-filter: blur(20px);
            border: 1px solid rgba(255,255,255,0.2);
            color: white;
            font-size: 24px;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: all 0.2s;
        }

        .btn:active {
            transform: scale(0.95);
        }

        .btn-primary {
            background: #2563eb;
            border: none;
        }

        /* Chat Modal */
        .chat-modal {
            position: fixed;
            bottom: 0;
            left: 0;
            right: 0;
            top: 0;
            background: rgba(0,0,0,0.8);
            z-index: 20;
            display: none;
            align-items: flex-end;
            backdrop-filter: blur(10px);
        }

        .chat-container {
            background: white;
            border-radius: 24px 24px 0 0;
            height: 70%;
            width: 100%;
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }

        .chat-header {
            padding: 20px;
            background: white;
            border-bottom: 1px solid #e5e7eb;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .chat-header h3 {
            font-size: 18px;
            color: #1f2937;
        }

        .close-chat {
            background: none;
            border: none;
            font-size: 28px;
            cursor: pointer;
            color: #6b7280;
        }

        .chat-messages {
            flex: 1;
            overflow-y: auto;
            padding: 16px;
            background: #f9fafb;
        }

        .message {
            margin-bottom: 12px;
            padding: 10px 14px;
            border-radius: 18px;
            max-width: 85%;
            font-size: 14px;
            line-height: 1.4;
        }

        .message.user {
            background: #2563eb;
            color: white;
            margin-left: auto;
        }

        .message.bot {
            background: white;
            color: #1f2937;
            border: 1px solid #e5e7eb;
        }

        .chat-input {
            padding: 16px;
            background: white;
            border-top: 1px solid #e5e7eb;
            display: flex;
            gap: 12px;
        }

        .chat-input input {
            flex: 1;
            padding: 12px 16px;
            border: 1px solid #e5e7eb;
            border-radius: 24px;
            outline: none;
            font-size: 14px;
        }

        .chat-input button {
            background: #2563eb;
            color: white;
            border: none;
            border-radius: 24px;
            padding: 12px 20px;
            cursor: pointer;
            font-weight: 500;
        }

        /* Camera permission prompt */
        .permission-prompt {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: black;
            z-index: 30;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }

        .permission-card {
            background: white;
            border-radius: 24px;
            padding: 32px;
            text-align: center;
            max-width: 300px;
        }

        .permission-card h2 {
            font-size: 24px;
            margin-bottom: 12px;
        }

        .permission-card p {
            color: #6b7280;
            margin-bottom: 24px;
            line-height: 1.5;
        }

        .permission-card button {
            background: #2563eb;
            color: white;
            border: none;
            padding: 14px 28px;
            border-radius: 30px;
            font-size: 16px;
            cursor: pointer;
            width: 100%;
        }

        /* Status */
        .status-bar {
            position: fixed;
            top: 20px;
            left: 20px;
            right: 20px;
            background: rgba(0,0,0,0.6);
            backdrop-filter: blur(10px);
            border-radius: 30px;
            padding: 8px 16px;
            z-index: 10;
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-size: 12px;
            color: #FFD700;
            pointer-events: none;
        }

        .status-dot {
            width: 8px;
            height: 8px;
            background: #10b981;
            border-radius: 50%;
            animation: pulse 1.5s infinite;
        }

        @keyframes pulse {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.3; }
        }

        .hidden {
            display: none;
        }
    </style>
</head>
<body>

    <!-- Camera Feed -->
    <video id="camera-view" autoplay playsinline muted></video>
    <canvas id="ar-canvas"></canvas>

    <!-- UI Overlay -->
    <div class="ui-overlay">
        <div class="info-card" id="info-card">
            <h1 id="building-title">🏛️ Cyprus Heritage AR</h1>
            <p id="building-description">Point camera at a marker to see historical buildings</p>
            <span class="badge" id="building-badge">Ready</span>
        </div>
        <div class="action-buttons">
            <button class="btn" id="chat-btn">💬</button>
        </div>
    </div>

    <!-- Status Bar -->
    <div class="status-bar">
        <span>📍 AR Ready</span>
        <div class="status-dot"></div>
    </div>

    <!-- Chat Modal -->
    <div class="chat-modal" id="chat-modal">
        <div class="chat-container">
            <div class="chat-header">
                <h3>🏛️ Heritage Guide AI</h3>
                <button class="close-chat" id="close-chat">✕</button>
            </div>
            <div class="chat-messages" id="chat-messages">
                <div class="message bot">Hello! Ask me about Cyprus's historical buildings! 🏺</div>
            </div>
            <div class="chat-input">
                <input type="text" id="chat-input" placeholder="Ask something...">
                <button id="send-chat">Send</button>
            </div>
        </div>
    </div>

    <!-- Permission Prompt -->
    <div class="permission-prompt" id="permission-prompt">
        <div class="permission-card">
            <h2>📷 Camera Access</h2>
            <p>This app needs camera access to show AR historical buildings</p>
            <button id="enable-camera">Enable Camera</button>
        </div>
    </div>

    <script>
        // ============================================
        // YOUR BUILDING DATA - EDIT THIS
        // ============================================
        
        const BUILDINGS = {
            // Marker ID: { title, description, period }
            "marker_0": {
                title: "Limassol Castle",
                description: "Medieval castle built in the 13th century. Richard the Lionheart married Berengaria of Navarre here in 1191.",
                period: "13th Century"
            },
            "marker_1": {
                title: "Kolossi Castle",
                description: "Crusader stronghold built in 1210 by the Knights of St. John. Famous for Commandaria wine production.",
                period: "1210 AD"
            },
            "marker_2": {
                title: "Amathus",
                description: "Ancient city-kingdom founded around 1100 BC. Major cult center for Aphrodite.",
                period: "1100 BC"
            },
            "marker_3": {
                title: "Kourion",
                description: "Greco-Roman city with spectacular amphitheater overlooking the Mediterranean.",
                period: "2nd Century BC"
            },
            "marker_4": {
                title: "St. Lazarus Church",
                description: "9th-century Byzantine church built over the tomb of Lazarus.",
                period: "890 AD"
            }
        };

        // ============================================
        // CAMERA SETUP
        // ============================================
        
        let stream = null;
        let detector = null;
        let isScanning = false;

        async function initCamera() {
            try {
                stream = await navigator.mediaDevices.getUserMedia({ 
                    video: { facingMode: "environment" }  // Use back camera
                });
                
                const video = document.getElementById('camera-view');
                video.srcObject = stream;
                await video.play();
                
                document.getElementById('permission-prompt').classList.add('hidden');
                startARDetection();
                
            } catch (err) {
                console.error('Camera error:', err);
                document.getElementById('building-description').innerHTML = '❌ Camera access denied. Please allow camera access.';
            }
        }

        // ============================================
        // SIMPLE MARKER DETECTION (No external libs)
        // ============================================
        
        function startARDetection() {
            const video = document.getElementById('camera-view');
            const canvas = document.getElementById('ar-canvas');
            const ctx = canvas.getContext('2d');
            
            isScanning = true;
            
            function detect() {
                if (!isScanning) return;
                
                if (video.readyState === video.HAVE_ENOUGH_DATA) {
                    canvas.width = video.videoWidth;
                    canvas.height = video.videoHeight;
                    ctx.drawImage(video, 0, 0, canvas.width, canvas.height);
                    
                    // Simulate marker detection with random for demo
                    // Replace this with actual marker detection logic
                    simulateMarkerDetection();
                }
                
                requestAnimationFrame(detect);
            }
            
            detect();
        }

        // Simulate detection - REPLACE with actual marker detection
        let lastMarker = null;
        function simulateMarkerDetection() {
            // For demo: Cycle through markers every 5 seconds
            // REPLACE THIS with actual computer vision detection
            const markers = Object.keys(BUILDINGS);
            const randomMarker = markers[Math.floor(Math.random() * markers.length)];
            
            if (randomMarker !== lastMarker) {
                lastMarker = randomMarker;
                showBuildingInfo(BUILDINGS[randomMarker]);
            }
        }

        function showBuildingInfo(building) {
            document.getElementById('building-title').textContent = `🏛️ ${building.title}`;
            document.getElementById('building-description').textContent = building.description;
            document.getElementById('building-badge').textContent = building.period;
            
            // Add animation
            const card = document.querySelector('.info-card');
            card.style.transform = 'translateY(10px)';
            setTimeout(() => {
                card.style.transform = 'translateY(0)';
            }, 200);
        }

        // ============================================
        // CHAT FUNCTIONALITY
        // ============================================
        
        const knowledgeBase = {
            "limassol castle": "Limassol Castle was built in the 13th century by the Lusignans. It's famous as the location where Richard the Lionheart married Berengaria of Navarre in 1191. Today it houses the Cyprus Medieval Museum.",
            "kolossi castle": "Kolossi Castle is a Crusader fortress built in 1210 by the Knights of St. John. It's known for producing Commandaria, one of the world's oldest wines.",
            "amathus": "Amathus was an ancient city-kingdom founded around 1100 BC. It was a major center for the worship of Aphrodite and was destroyed by Richard the Lionheart in 1180 AD.",
            "kourion": "Kourion is a Greco-Roman city with a stunning amphitheater overlooking the sea. It features beautiful mosaics and was an important city from the 2nd century BC until the 7th century AD.",
            "st. lazarus": "The Church of St. Lazarus was built in 890 AD over the tomb of Lazarus. It's one of Cyprus's most important pilgrimage sites and features beautiful Byzantine architecture."
        };
        
        function getAIResponse(question) {
            const q = question.toLowerCase();
            
            for (const [key, answer] of Object.entries(knowledgeBase)) {
                if (q.includes(key)) {
                    return answer;
                }
            }
            
            return "🏛️ I can tell you about: Limassol Castle, Kolossi Castle, Amathus, Kourion, or St. Lazarus Church. Which would you like to learn about?";
        }

        // Chat UI
        const chatModal = document.getElementById('chat-modal');
        const chatBtn = document.getElementById('chat-btn');
        const closeChat = document.getElementById('close-chat');
        const sendBtn = document.getElementById('send-chat');
        const chatInput = document.getElementById('chat-input');
        const chatMessages = document.getElementById('chat-messages');

        chatBtn.onclick = () => {
            chatModal.style.display = 'flex';
        };

        closeChat.onclick = () => {
            chatModal.style.display = 'none';
        };

        function addMessage(text, sender) {
            const msgDiv = document.createElement('div');
            msgDiv.className = `message ${sender}`;
            msgDiv.textContent = text;
            chatMessages.appendChild(msgDiv);
            chatMessages.scrollTop = chatMessages.scrollHeight;
        }

        sendBtn.onclick = () => {
            const question = chatInput.value.trim();
            if (!question) return;
            
            addMessage(question, 'user');
            chatInput.value = '';
            
            setTimeout(() => {
                const answer = getAIResponse(question);
                addMessage(answer, 'bot');
            }, 300);
        };

        chatInput.onkeypress = (e) => {
            if (e.key === 'Enter') sendBtn.onclick();
        };

        // ============================================
        // INIT
        // ============================================
        
        document.getElementById('enable-camera').onclick = initCamera;
        
        // Check if camera is already available
        if (navigator.mediaDevices && navigator.mediaDevices.getUserMedia) {
            // Wait for user interaction (browser policy)
            console.log('Ready - click Enable Camera');
        } else {
            document.getElementById('permission-prompt').innerHTML = '<div class="permission-card"><h2>⚠️ Not Supported</h2><p>Your browser doesn\'t support camera access. Try Chrome or Safari.</p></div>';
        }
    </script>
</body>
</html>
